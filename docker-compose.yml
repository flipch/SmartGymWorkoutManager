# SmartGymWorkoutManager — flipch fork (homelab deploy)
# Two services from one image: the Flask web UI (5001) and the MCP server (5002).
# A shared named volume mounted at /data (DATA_DIR) holds config.json — the
# logged-in user's Speediance token — plus the cached exercise library, so
# logging in via the web UI immediately authenticates the MCP too.
services:
  smart-gym-app:
    build: .
    image: smart-gym:flipch
    container_name: smart_gym_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data
      - TZ=${TZ:-America/Los_Angeles}
      # shared secret for the web UI (HTTP Basic, any username) — set in .env (gitignored)
      - GYM_API_TOKEN=${GYM_API_TOKEN:?set GYM_API_TOKEN in .env}
      # account-changing browser actions (create/edit/schedule/delete/unit/logout) need this; also set on the MCP below
      - GYM_ALLOW_WRITES=${GYM_ALLOW_WRITES:-0}
      # extra browser origins allowed to POST (comma separated); empty = same host only
      - GYM_ALLOWED_ORIGINS=${GYM_ALLOWED_ORIGINS:-}
      # signs flash cookies; random per start when empty
      - GYM_SECRET_KEY=${GYM_SECRET_KEY:-}
    volumes:
      - gym-data:/data
    command: ["gunicorn", "-w", "1", "-b", "0.0.0.0:5001", "--timeout", "120", "app:app"]

  smart-gym-mcp:
    build: .
    image: smart-gym:flipch
    container_name: smart_gym_mcp
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5002
      - TZ=${TZ:-America/Los_Angeles}
      # bearer token required on every MCP request; write tools stay off unless GYM_ALLOW_WRITES=1
      - GYM_API_TOKEN=${GYM_API_TOKEN:?set GYM_API_TOKEN in .env}
      - GYM_ALLOW_WRITES=${GYM_ALLOW_WRITES:-0}
    volumes:
      - gym-data:/data
    depends_on:
      - smart-gym-app
    command: ["python", "mcp_server.py"]
    # override the image healthcheck (which probes the Flask port 5001):
    # this service serves the MCP on 5002, so check that instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5002), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  gym-data:
